name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  e2e:
    name: Browser e2e
    runs-on: ubuntu-latest
    # Setup is ~75 s and the suite's own guard is 420 s, so 15 minutes is margin for a hang, not a
    # performance assertion.
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx e2e-web install chromium --with-deps

      - name: Run e2e
        run: |
          started=$(date +%s)
          npm run e2e
          elapsed=$(( $(date +%s) - started ))
          echo "e2e suite wall clock: ${elapsed}s"
          # The guard is a hang detector, not a performance assertion. It keeps the suite's whole
          # history: 666 s on 2026-11-10 (233 tests), 748/751/847 s on 2026-11-12 (283 tests, 2
          # flaky), 1003 s and 1119 s on 2026-11-13 (306 tests), then 230–238 s after the core cut
          # (58 tests). The 420 s ceiling is the anti-regrowth budget, not a target.
          if [ "${elapsed}" -gt 420 ]; then
            echo "::error::e2e suite took ${elapsed}s, over the 420s budget"
            exit 1
          fi
