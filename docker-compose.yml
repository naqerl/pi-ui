# Documentation that runs: the host paths below are the complete runtime state.
# The image itself contains no credentials and no extensions. It is stateless
# apart from these three mutable, host-backed paths: data/ (the durable
# conversation), PI_CODING_AGENT_DIR (pi credentials and model catalog), and
# billion-context (compression fold state). The zeroshot config mount is
# read-only and supplies the hub token the MCP Authorization header reads.
services:
  pi-ui:
    image: ghcr.io/naqerl/pi-ui:${PI_UI_TAG:-latest}
    build:
      context: .
    # The hub MCP listens on the host loopback only, and mcp.json addresses it
    # as http://127.0.0.1:7383/mcp. Bridge networking would make that address
    # the container itself, so the server would disappear from the tool set.
    network_mode: host
    # No ports mapping: the listener binds the host network directly; its port
    # still comes from PORT (8787 by default).
    environment:
      PORT: "${PORT:-8787}"
      PI_CWD: /workspace
      PI_CODING_AGENT_DIR: /home/pi/.pi/agent
      # The durable conversation lives in data/ inside the workspace mount.
      # Override only if the replacement path is also inside /workspace.
      DATA_DIR: /workspace/data
    volumes:
      # pi's working tree plus data/pi.sqlite3 and data/current.json (the durable
      # conversation). Survives container replacement.
      - "${PI_WORK_DIR:-./work}:/workspace"
      # Read-write because pi updates state/history here. This is PI_CODING_AGENT_DIR:
      # auth.json, web-search.json, and the model catalog (models-store.json,
      # settings.json, installed pi packages) come from this mount.
      - "${PI_AGENT_DIR:-$HOME/.pi/agent}:/home/pi/.pi/agent"
      # billion-context fold state (sessions/index.db/logs). Must be writable by
      # uid 1000 and persist across container replacement, or fold history is lost.
      # Create it first on the host: mkdir -p ~/.local/share/billion-context
      - "${BILI_DATA_DIR:-$HOME/.local/share/billion-context}:/home/pi/.local/share/billion-context"
      # Read-only: mcp.json fetches the hub token with an `!`-prefixed header
      # command, `!echo Bearer $(cat /home/user/.config/zeroshot/hub/api-token)`.
      # That command runs inside the container, so the token file must exist at
      # the same absolute path here.
      - "${ZEROSHOT_CONFIG_DIR:-$HOME/.config/zeroshot}:/home/user/.config/zeroshot:ro"
    restart: unless-stopped
