# Documentation that runs: the two host paths below are the complete runtime state.
# The image itself contains no credentials and no extensions.
services:
  pi-ui:
    image: ghcr.io/naqerl/pi-ui:${PI_UI_TAG:-latest}
    build:
      context: .
    ports:
      # The container always listens on 8787; change only the host side with PORT.
      - "${PORT:-8787}:8787"
    environment:
      PORT: "8787"
      PI_CWD: /workspace
      PI_CODING_AGENT_DIR: /home/pi/.pi/agent
      # Optional: split the durable database out of <workspace>/data
      # (must be inside /workspace to persist).
      # DATA_DIR: /workspace/data
    volumes:
      # One directory for everything a session produces: pi's working tree plus
      # <mount>/data/pi.sqlite3 and current.json. Survives container replacement.
      - "${PI_WORK_DIR:-./work}:/workspace"
      # Read-write because pi updates state/history here. auth.json and the model
      # catalog (settings.json, models-store.json, installed pi packages) come from this mount.
      - "${PI_AGENT_DIR:-$HOME/.pi/agent}:/home/pi/.pi/agent"
    restart: unless-stopped
